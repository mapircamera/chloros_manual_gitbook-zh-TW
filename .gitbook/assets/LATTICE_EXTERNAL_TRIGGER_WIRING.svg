<text x="435" y="464" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#1D6FC2">blue — 0 V return</text>

<rect x="60" y="508" width="936" height="90" fill="#FFF7E8" stroke="#E0A030" stroke-width="1.2"/>
<rect x="60" y="508" width="5" height="90" fill="#D98E04"/>
<text x="82" y="533" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7A4A00">Required — common 0 V reference</text>
<text x="82" y="555" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4A3A20">The trigger return (M12 pin 2, black) must connect to the negative (0 V) terminal of the same power supply that powers the sensor.</text>
<text x="82" y="574" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4A3A20">This return path completes the trigger circuit — without it, the camera never sees the signal.</text>
<text x="82" y="593" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#4A3A20">Earth/chassis ground is not a substitute: many industrial 24 V supplies float relative to chassis.</text>

<text x="60" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111111">Trigger cordset (MAPIR-supplied, red / black)</text>
<rect x="60" y="630" width="440" height="26" fill="#EFEFEF" stroke="#999999" stroke-width="1"/>
<rect x="60" y="656" width="440" height="52" fill="none" stroke="#999999" stroke-width="1"/>
<line x1="60" y1="682" x2="500" y2="682" stroke="#CCCCCC" stroke-width="1"/>
