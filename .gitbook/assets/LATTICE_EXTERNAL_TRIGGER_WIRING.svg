<text x="660" y="197" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#444444">Harness M12</text>
<text x="660" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">2-pin, A-coded</text>
