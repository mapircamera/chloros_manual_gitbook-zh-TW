<text x="600" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#222222">black</text>
<line x1="660" y1="370" x2="720" y2="370" stroke="#999999" stroke-width="2.5"/>
<line x1="555" y1="424" x2="555" y2="456" stroke="#1D6FC2" stroke-width="2.5" marker-end="url(#chev)"/>
