<text x="660" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555555">pin 2</text>

<rect x="720" y="190" width="230" height="250" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="835" y="219" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#111111">LATTICE master module</text>
<text x="732" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Pin 8 — OPTO IN</text>
<text x="732" y="391" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333">Pin 6 — OPTO GND</text>
