<text x="138" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">Wire</text>
<text x="222" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">Function</text>
<text x="420" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">M8 pin</text>
<text x="70" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">1</text>
<text x="138" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Red</text>
<text x="222" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Trigger signal (OPTO IN)</text>
<text x="420" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">8</text>
<text x="70" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">2</text>
<text x="138" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Black</text>
<text x="222" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Trigger return (OPTO GND)</text>
<text x="420" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">6</text>

<text x="556" y="622" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#111111">Sensor cordset (IEC colors, IFM O6E400)</text>
<rect x="556" y="630" width="440" height="26" fill="#EFEFEF" stroke="#999999" stroke-width="1"/>
<rect x="556" y="656" width="440" height="78" fill="none" stroke="#999999" stroke-width="1"/>
<line x1="556" y1="682" x2="996" y2="682" stroke="#CCCCCC" stroke-width="1"/>
<line x1="556" y1="708" x2="996" y2="708" stroke="#CCCCCC" stroke-width="1"/>
