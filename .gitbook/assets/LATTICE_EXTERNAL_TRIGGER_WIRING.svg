<line x1="806" y1="630" x2="806" y2="734" stroke="#CCCCCC" stroke-width="1"/>
<text x="566" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">Wire</text>
<text x="656" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">Function</text>
<text x="816" y="647" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#333333">Connect to</text>
<text x="566" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Brown</text>
<text x="656" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Supply +</text>
<text x="816" y="673" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">+24 V regulated (max 24 V)</text>
<text x="566" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Blue</text>
<text x="656" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Supply −</text>
<text x="816" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Supply 0 V</text>
<text x="566" y="725" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Black</text>
<text x="656" y="725" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">PNP output</text>
<text x="816" y="725" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#333333">Cordset red (signal)</text>

<text x="60" y="750" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">* Trigger cordset colors (red / black) assume the MAPIR-supplied M12 cable — verify against the cable datasheet before wiring.</text>
<text x="60" y="766" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">* Each trigger captures a frame from every module; max trigger rate depends on exposure and network throughput; over-rate triggers are discarded.</text>
<text x="60" y="782" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#666666">* Recommended network: switch with 10/100/1G/2.5G camera + DAQ-E ports and 10G uplink (available from MAPIR, non-waterproof).</text>

<line x1="60" y1="792" x2="996" y2="792" stroke="#DDDDDD" stroke-width="1"/>
<text x="60" y="808" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#888888">MAPIR Camera Inc. — LATTICE accessory documentation</text>
<text x="996" y="808" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#888888">Rev B — July 2026</text>
